services:
  - type: web
    name: disasterlink-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
      - key: JWT_SECRET
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: GITHUB_CLIENT_ID
      - key: GITHUB_CLIENT_SECRET
      - key: SESSION_SECRET
      - key: CLIENT_URL
      - key: BACKEND_URL
